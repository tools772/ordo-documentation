<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Perfect Ventures docs</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #0f172a;
        --muted: #64748b;
        --bg: #f8fafc;
        --card: #ffffff;
        --line: #e2e8f0;
        --accent: #0891b2;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #e2e8f0;
          --muted: #94a3b8;
          --bg: #0f172a;
          --card: #1e293b;
          --line: #334155;
        }
      }
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      main {
        max-width: 40rem;
        margin: 4rem auto;
        padding: 0 1.5rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: var(--muted);
        line-height: 1.5;
      }
      a.card {
        display: block;
        margin-top: 1.5rem;
        padding: 1.1rem 1.25rem;
        border: 1px solid var(--line);
        border-radius: 0.75rem;
        background: var(--card);
        color: inherit;
        text-decoration: none;
      }
      a.card:hover {
        border-color: var(--accent);
      }
      a.card strong {
        color: var(--accent);
      }
      a.card span {
        display: block;
        margin-top: 0.35rem;
        color: var(--muted);
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Perfect Ventures docs</h1>
      <p>Product help sites. Each product has its own path so more docs can live here later.</p>
      <a class="card" href="/ordo/">
        <strong>Ordo</strong>
        <span>Insurance payment posting for dental practices</span>
      </a>
    </main>
  </body>
</html>
